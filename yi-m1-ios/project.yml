name: YiM1Monitor
options:
  bundleIdPrefix: com.yim1monitor
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  YiM1Core:
    path: YiM1Core

targets:
  YiM1Monitor:
    type: application
    platform: iOS
    sources:
      - path: YiM1Monitor
        excludes:
          - "App/Info.plist"
          - "Design/AppIcon.svg" # source artifact for the rasterized Assets.xcassets icon, not a runtime resource
    dependencies:
      - package: YiM1Core
    info:
      path: YiM1Monitor/App/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        NSBluetoothAlwaysUsageDescription: "YI M1 Monitor 需要使用蓝牙与相机配对，并读取相机本次生成的 Wi-Fi 连接信息。"
        NSLocalNetworkUsageDescription: "YI M1 Monitor 需要连接相机自身的 Wi-Fi 网络，以显示实时取景并发送相机控制指令。"
        NSPhotoLibraryAddUsageDescription: "YI M1 Monitor 需要将从相机下载的照片和视频保存到系统照片图库。"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
      settings:
        base:
          PRODUCT_BUNDLE_IDENTIFIER: com.yim1monitor.app
          PRODUCT_NAME: YiM1Monitor
          SWIFT_VERSION: 5.0
          TARGETED_DEVICE_FAMILY: "1" # iPhone only
          GENERATE_INFOPLIST_FILE: NO
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
